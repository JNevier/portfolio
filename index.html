<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Reiven O. Jasa — Full-Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Reiven O. Jasa, a BS Computer Science student in Batangas, Philippines, building full-stack web applications and embedded systems with React, TypeScript, Node.js and C++."
    />
    <meta name="theme-color" content="#0f766e" />

    <!--
      Sets the saved (or system) theme before the page paints, so a dark-mode
      visitor never sees a flash of the light theme. ThemeProvider takes over
      once React has loaded. Uses the same "theme" key as src/context/ThemeContext.ts.
    -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) {
        // Storage blocked: the page simply starts in the light theme.
      }
    </script>

    <!-- Open Graph / social previews (how the link looks when shared). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Reiven O. Jasa — Full-Stack Developer" />
    <meta
      property="og:description"
      content="BS Computer Science student building full-stack web apps and embedded systems. Projects, skills, and contact details."
    />
    <meta property="og:image" content="https://reiven-jasa.vercel.app/og-image.png" />
    <meta property="og:url" content="https://reiven-jasa.vercel.app/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Reiven O. Jasa, Full-Stack Developer and Computer Science Student"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
